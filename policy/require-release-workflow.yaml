# Kyverno 1.20+: legacy kyverno.io/v1 ClusterPolicy is no longer accepted.
# This is the policies.kyverno.io ImageValidatingPolicy equivalent.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-release-workflow
spec:
  validationActions: [Deny]          # [Audit] for the audit -> block migration
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: demo
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
  matchImageReferences:
    - glob: 'ghcr.io/sonalgaud12/who-signed-this*'
  validationConfigurations:
    mutateDigest: true               # rewrites tag -> verified digest
    verifyDigest: true
    required: true
  attestors:
    - name: release
      cosign:
        keyless:
          identities:
            # WHO issued the token + WHICH workflow file, in WHICH repo, at WHICH ref
            - issuer: 'https://token.actions.githubusercontent.com'
              subject: 'https://github.com/sonalgaud12/who-signed-this/.github/workflows/release.yaml@refs/heads/main'
        ctlog:
          url: 'https://rekor.sigstore.dev'
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.release])).all(e, e > 0)
      message: 'image must be signed by release.yaml on main in sonalgaud12/who-signed-this'